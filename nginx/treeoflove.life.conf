# Tree of Love reverse proxy. Install as /etc/nginx/sites-available/treeoflove.life
# The upstream port must match APP_PORT in .env.

limit_req_zone $binary_remote_addr zone=treeoflove_login:10m rate=10r/m;

map $request_method $treeoflove_form_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $treeoflove_form_key zone=treeoflove_posts:10m rate=20r/m;

upstream treeoflove_app {
    server 127.0.0.1:3020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name treeoflove.life www.treeoflove.life;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.treeoflove.life$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name treeoflove.life;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.treeoflove.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.treeoflove.life/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.treeoflove.life$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.treeoflove.life;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.treeoflove.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.treeoflove.life/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Photo uploads in the admin.
    client_max_body_size 25m;

    # Locations below must not use add_header, or these are dropped for them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    limit_req_status 429;

    # first-register is only accepted by Payload while the users table is empty.
    location ~ ^/api/users/(login|forgot-password|reset-password|first-register|unlock)$ {
        limit_req zone=treeoflove_login burst=5 nodelay;
        proxy_pass http://treeoflove_app;
    }

    # Not used by the site or the admin.
    location ~ ^/api/graphql {
        return 404;
    }

    location /api/ {
        proxy_pass http://treeoflove_app;
    }

    location /admin {
        proxy_pass http://treeoflove_app;
    }

    location /_next/static/ {
        proxy_pass http://treeoflove_app;
    }

    # Public pages. POSTs here are the contact and donate forms.
    location / {
        limit_req zone=treeoflove_posts burst=10 nodelay;
        proxy_pass http://treeoflove_app;
    }
}
